name: Packaging

on:
  pull_request:
    branches:
      - main
      - "[0-9]+.[0-9]+"
      - "8.x"
    types: [opened, synchronize, reopened]
  merge_group:
    branches:
      - main
      - "[0-9]+.[0-9]+"

env:
  DEV: true
  SNAPSHOT: true
  PLATFORMS: linux/amd64
  GOPATH: /home/runner/go
  GOEXPERIMENT: jsonv2 # required by trivy v0.69.3+ (encoding/json/v2)

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  package_beat:
    name: Package Cloudbeat
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        types: [tar.gz, docker]
    steps:
      - name: Check out the repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Hermit Environment
        uses: ./.github/actions/hermit
        with:
          init-tools: 'true'

      - name: DEBUG python venv (temporary)
        continue-on-error: true
        run: |
          set +e
          echo "--- hermit version"; ./bin/hermit version 2>&1 | head -3
          echo "--- python3 resolution"; type -a python3; python3 --version
          python3 -c 'import sys; print("executable", sys.executable); print("prefix", sys.prefix); print("base_prefix", sys.base_prefix); print("path", sys.path)'
          echo "--- relevant env"; env | grep -E '^(PATH|PYTHON|PIP|HERMIT|ACTIVE_HERMIT|VIRTUAL_ENV|GOTOOLCHAIN)' | sort
          echo "--- venv without pip"; rm -rf /tmp/ve-debug
          python3 -m venv --without-pip /tmp/ve-debug; echo "venv exit=$?"
          cat /tmp/ve-debug/pyvenv.cfg; ls -la /tmp/ve-debug/bin
          echo "--- ensurepip verbose (the step that fails under mage)"
          /tmp/ve-debug/bin/python3 -m ensurepip --upgrade --default-pip -v; echo "ensurepip exit=$?"
          echo "--- the exact failing command"; rm -rf /tmp/ve-debug2
          python3 -m venv /tmp/ve-debug2; echo "venv(with pip) exit=$?"

      - name: Packaging
        run: |
          mage -v package
        env:
          TYPES: ${{ matrix.types }}
