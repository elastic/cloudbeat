name: Packaging

on:
  pull_request:
    branches:
      - main
      - "[0-9]+.[0-9]+"
      - "8.x"
    types: [opened, synchronize, reopened]
  merge_group:
    branches:
      - main
      - "[0-9]+.[0-9]+"

env:
  DEV: true
  SNAPSHOT: true
  PLATFORMS: linux/amd64
  GOPATH: /home/runner/go
  GOEXPERIMENT: jsonv2 # required by trivy v0.69.3+ (encoding/json/v2)

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  package_beat:
    name: Package Cloudbeat
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        types: [tar.gz, docker]
    steps:
      - name: Check out the repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Hermit Environment
        uses: ./.github/actions/hermit
        with:
          init-tools: 'true'

      - name: Packaging
        run: |
          # Hermit v0.54.1 puts a link farm ahead of bin/ on PATH. "python3 -m venv" run from there
          # records the link farm directory as the venv home, and the venv's python then cannot find
          # its standard library (ModuleNotFoundError: No module named 'encodings'). Put the directory
          # of the real interpreter first so the venv is created from it.
          PYTHON_BIN_DIR="$(dirname "$(readlink -f "$(command -v python3)")")"
          export PATH="${PYTHON_BIN_DIR}:${PATH}"
          echo "python3 -> $(command -v python3)"
          mage -v package
        env:
          TYPES: ${{ matrix.types }}
