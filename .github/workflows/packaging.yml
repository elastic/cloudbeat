name: Packaging

on:
  pull_request:
    branches:
      - main
      - "[0-9]+.[0-9]+"
      - "8.x"
    types: [opened, synchronize, reopened]
  merge_group:
    branches:
      - main
      - "[0-9]+.[0-9]+"

env:
  DEV: true
  SNAPSHOT: true
  PLATFORMS: linux/amd64
  GOPATH: /home/runner/go
  GOEXPERIMENT: jsonv2 # required by trivy v0.69.3+ (encoding/json/v2)

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  package_beat:
    name: Package Cloudbeat
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        types: [tar.gz, docker]
    steps:
      - name: Check out the repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Hermit Environment
        uses: ./.github/actions/hermit
        with:
          init-tools: 'true'

      - name: Debug python and hermit (temporary)
        continue-on-error: true
        run: |
          set +e
          echo "::group::hermit"
          hermit version 2>&1 | head -3
          ls -la "${HERMIT_STATE_DIR:-$HOME/.cache/hermit}/pkg" | head -30
          echo "::endgroup::"
          PYTHON_BIN_DIR="$(ls -d "${HERMIT_STATE_DIR:-$HOME/.cache/hermit}"/pkg/python3-*/install/bin 2>/dev/null | sort -V | tail -n 1)"
          PY_ROOT="$(dirname "${PYTHON_BIN_DIR}")"
          echo "::group::real python install tree (${PY_ROOT})"
          ls -la "${PYTHON_BIN_DIR}" | head -30
          ls -la "${PY_ROOT}" "${PY_ROOT}/lib" 2>&1 | head -40
          echo "encodings dir:"; ls -d "${PY_ROOT}"/lib/python3*/encodings 2>&1; ls "${PY_ROOT}"/lib/python3*/encodings 2>/dev/null | wc -l
          readlink -f "${PYTHON_BIN_DIR}/python3"
          echo "::endgroup::"
          echo "::group::python env"
          env | grep -iE '^(PYTHON|HERMIT|VIRTUAL|LD_|POETRY|CLOUDSDK_PYTHON)' | sort
          echo "PATH=$PATH" | tr ':' '\n' | head -20
          echo "default python3: $(command -v python3) -> $(readlink -f "$(command -v python3)")"
          "${PYTHON_BIN_DIR}/python3" -c 'import sys; print("version", sys.version); print("executable", sys.executable); print("prefix", sys.prefix, "base_prefix", sys.base_prefix); print("path", sys.path)'
          echo "::endgroup::"
          echo "::group::venv with the real python"
          rm -rf /tmp/ve-real && "${PYTHON_BIN_DIR}/python3" -m venv --without-pip /tmp/ve-real; echo "venv rc=$?"
          cat /tmp/ve-real/pyvenv.cfg; ls -la /tmp/ve-real/bin
          /tmp/ve-real/bin/python3 -c 'import encodings, sys; print("encodings ok", sys.prefix)' 2>&1 | tail -5
          echo "::endgroup::"
          echo "::group::verbose import in the venv"
          /tmp/ve-real/bin/python3 -v -c 'import encodings' 2>&1 | head -25
          echo "::endgroup::"
          echo "::group::venv with default python3"
          rm -rf /tmp/ve-default && python3 -m venv --without-pip /tmp/ve-default; echo "venv rc=$?"
          cat /tmp/ve-default/pyvenv.cfg
          /tmp/ve-default/bin/python3 -c 'import encodings; print("encodings ok")' 2>&1 | tail -3
          echo "::endgroup::"

      - name: Packaging
        run: |
          # Hermit v0.54.1 runs python3 through a link farm or stub, and "python3 -m venv" then records
          # that directory as the venv home. The venv's python cannot find its standard library
          # (ModuleNotFoundError: No module named 'encodings'), so ensurepip fails. Put the real
          # interpreter's directory first on PATH, found in the Hermit package dir so it does not
          # depend on what python3 currently resolves to.
          PYTHON_BIN_DIR="$(ls -d "${HERMIT_STATE_DIR:-$HOME/.cache/hermit}"/pkg/python3-*/install/bin 2>/dev/null | sort -V | tail -n 1)"
          if [ -x "${PYTHON_BIN_DIR}/python3" ]; then
            export PATH="${PYTHON_BIN_DIR}:${PATH}"
          else
            echo "::warning::real python3 not found under the Hermit package dir (${PYTHON_BIN_DIR:-none})"
          fi
          echo "python3 -> $(command -v python3)"
          mage -v package
        env:
          TYPES: ${{ matrix.types }}
