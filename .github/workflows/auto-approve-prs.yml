# This workflow automatically approves bot PRs that need no human review, using the GitHub Actions bot.
# scripts/approve-pr.sh decides which PRs qualify:
#   - Renovate PRs with the 'renovate-auto-approve' label, set by renovate.json. Renovate merges them itself.
#   - Patch version bump PRs with the 'version-bump-auto-approve' label, set by
#     .buildkite/scripts/release/bump-patch.sh, that only change defaultBeatVersion in version/version.go.
#
# pull_request_target runs this workflow and the script from the base branch and never checks out PR code,
# so a PR cannot change the rules that judge it. Keep a copy on every active release branch.
name: Auto-approve bot PRs

on:
  pull_request_target:
    branches:
      - main
      - "9.*"
      - "8.*"
    #  - 'auto_merge_enabled' is triggered when Renovate enables auto-merge on a PR it will merge itself.
    #  - 'labeled' is triggered when a label is added, which happens right after a bot opens the PR.
    #  - 'synchronize' is triggered when a new commit is pushed to the PR.
    types: [auto_merge_enabled, labeled, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}

jobs:
  approve:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.type == 'Bot'
    steps:
      - name: Checkout base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Approve PR using GitHub Actions Bot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: scripts/approve-pr.sh "${PR}"
