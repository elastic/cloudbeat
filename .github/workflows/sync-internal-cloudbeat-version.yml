name: Sync Cloudbeat Versions on release
# Makes sure all cloudbeat versions are updated with release branches
on:
  # Runs daily: the script only opens a hermit.hcl sync PR once the target
  # ${version}-SNAPSHOT is actually published, so it self-heals drift without
  # ever pinning an unavailable build.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  synchronize-versions:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      # TokenPolicy: token-policy-cloudbeat-sync-internal-version
      # https://github.com/elastic/catalog-info/tree/main/resources/github-token-policies
      - name: Fetch ephemeral GitHub token
        id: fetch-token
        uses: elastic/ci-gh-actions/fetch-github-token@2feb1c6f5086cf8e06f61ef35e275abed3456f7b # v1.5.3
        with:
          vault-instance: ci-prod

      - name: Check out the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          token: ${{ steps.fetch-token.outputs.token }}

      - name: Synchronize versions using a script
        env:
          GH_TOKEN: ${{ steps.fetch-token.outputs.token }}
        run: |
          ./scripts/sync_internal_cloudbeat_version.sh
