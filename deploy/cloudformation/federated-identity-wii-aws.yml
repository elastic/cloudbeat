AWSTemplateFormatVersion: "2010-09-09"

Description: 'Creates the IAM OIDC identity provider for Elastic Workload Identity if this account does not have one yet, and an IAM Role that only the given Elastic deployment or project can assume. The role grants read-only permissions for all Elastic AWS integrations that support Identity Federation: the AWS package integrations (GuardDuty, Inspector, Config, CloudWatch, and metrics services)'

Parameters:
  ElasticOrganizationId:
    Description: Elastic Cloud organization ID, pre-filled by Kibana.
    Type: String
    AllowedPattern: ^[A-Za-z0-9]{1,32}$
    ConstraintDescription: must be 1-32 letters or digits.

  ElasticCloudProvider:
    Description: Cloud provider the Elastic deployment or project runs on, pre-filled by Kibana.
    Type: String
    AllowedValues:
      - aws
      - azure
      - gcp

  ElasticCloudRegion:
    Description: Region the Elastic deployment or project runs in (for example eu-west-1, us-central1, eastus2), pre-filled by Kibana.
    Type: String
    AllowedPattern: ^[a-z0-9-]+$
    ConstraintDescription: must be a lowercase region name.

  ElasticCloudEnvironment:
    Description: Elastic Cloud environment, pre-filled by Kibana. Use production unless testing against an Elastic test environment.
    Type: String
    AllowedValues:
      - production
      - staging
      - qa

  ElasticResourceType:
    Description: deployment for Elastic Cloud Hosted, project for Elastic Cloud Serverless. Pre-filled by Kibana.
    Type: String
    AllowedValues:
      - deployment
      - project

  ElasticResourceId:
    Description: Kibana component ID of the deployment, or the Serverless project ID. Pre-filled by Kibana.
    Type: String
    AllowedPattern: ^[A-Za-z0-9]+$
    ConstraintDescription: must contain only letters and digits.

  ElasticCallbackUrl:
    Description: URL of the Kibana callback this stack reports to, pre-filled by Kibana. When set together with ElasticApiKey, the stack reports the role it created back to Kibana so you do not have to paste it. Leave empty to paste the outputs manually.
    Type: String
    Default: ""
    AllowedPattern: ^$|^https://[^\s/]+/[^\s]+$
    ConstraintDescription: must be empty or an https URL with a path.

  ElasticApiKey:
    Description: Short-lived, zero-privilege API key that only lets this stack report back to Kibana. Pre-filled by Kibana; not shown in the console.
    Type: String
    Default: ""
    AllowedPattern: ^[A-Za-z0-9+/=]*$
    ConstraintDescription: must be empty or the base64 key Kibana pre-filled.
    NoEcho: true

Mappings:
  EnvironmentDomain:
    production:
      Domain: svc.elastic.cloud
    staging:
      Domain: svc.staging.elastic.cloud
    qa:
      Domain: svc.qa.elastic.cloud

Conditions:
  CallbackEnabled: !And
    - !Not
      - !Equals
        - !Ref ElasticCallbackUrl
        - ""
    - !Not
      - !Equals
        - !Ref ElasticApiKey
        - ""

Resources:

  # The trust is built from the two claims of the Elastic Workload Identity JWT:
  #   iss = https://workload-identity-issuer.<region>.<provider>.<domain>/orgs/<org>
  #   sub = <deployment|project>:<id>
  # IAM allows one OIDC provider per issuer per account and every stack for
  # this issuer shares it, so a custom resource creates it only when missing
  # and never deletes it. The function can only touch this one provider.
  # The stack owns the function's log group so deleting the stack removes it;
  # the function may only write to this group and cannot create others.
  WiiOidcProviderFunctionLogGroup:
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14
  WiiOidcProviderFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ElasticWorkloadIdentityOidcProviderLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt WiiOidcProviderFunctionLogGroup.Arn
        - PolicyName: ElasticWorkloadIdentityOidcProvider
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - iam:GetOpenIDConnectProvider
                  - iam:CreateOpenIDConnectProvider
                  - iam:AddClientIDToOpenIDConnectProvider
                Resource: !Sub
                  - arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/workload-identity-issuer.${ElasticCloudRegion}.${ElasticCloudProvider}.${Domain}/orgs/${ElasticOrganizationId}
                  - Domain: !FindInMap
                      - EnvironmentDomain
                      - !Ref ElasticCloudEnvironment
                      - Domain
  WiiOidcProviderFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt WiiOidcProviderFunctionRole.Arn
      Timeout: 120
      LoggingConfig:
        LogGroup: !Ref WiiOidcProviderFunctionLogGroup
      Code:
        ZipFile: |
          import json
          import time
          import urllib.request

          import boto3
          from botocore.exceptions import ClientError

          iam = boto3.client("iam")

          # EntityAlreadyExists: another stack created the provider between our read
          # and create. AccessDenied: the function role's policy may still be
          # propagating right after stack creation. OpenIdIdpCommunicationError:
          # IAM contacts the issuer during create. The rest are transient.
          RETRYABLE = {
              "EntityAlreadyExists",
              "AccessDenied",
              "OpenIdIdpCommunicationError",
              "ConcurrentModification",
              "Throttling",
              "ServiceFailure",
          }

          ACCESS_DENIED_HINT = (
              "This account denied permission to look up or create the IAM OIDC identity provider "
              "for its issuer in this account. Check that no service control policy or permissions "
              "boundary denies iam:GetOpenIDConnectProvider, iam:CreateOpenIDConnectProvider, or "
              "iam:AddClientIDToOpenIDConnectProvider on this provider. AWS reported: "
          )


          def handler(event, context):
              if event["RequestType"] == "Delete":
                  respond(event, "SUCCESS", event["PhysicalResourceId"])
                  return
              arn = None
              try:
                  url = event["ResourceProperties"]["Url"]
                  arn = provider_arn(context.invoked_function_arn, url)
                  ensure_provider(arn, url, "sts.amazonaws.com")
              except Exception as e:
                  # Report every failure; an unanswered request only fails after ServiceTimeout.
                  physical_id = event.get("PhysicalResourceId") or arn or context.log_stream_name
                  respond(event, "FAILED", physical_id, reason=failure_reason(e))
                  return
              respond(event, "SUCCESS", arn, data={"Arn": arn, "Issuer": url.removeprefix("https://")})


          def provider_arn(function_arn, url):
              _, partition, _, _, account, _ = function_arn.split(":", 5)
              return f"arn:{partition}:iam::{account}:oidc-provider/{url.removeprefix('https://')}"


          def ensure_provider(arn, url, client_id):
              for attempt in range(5):
                  try:
                      client_ids = existing_client_ids(arn)
                      if client_ids is None:
                          iam.create_open_id_connect_provider(Url=url, ClientIDList=[client_id])
                      elif client_id not in client_ids:
                          iam.add_client_id_to_open_id_connect_provider(
                              OpenIDConnectProviderArn=arn, ClientID=client_id
                          )
                      return
                  except ClientError as e:
                      if not retryable(e) or attempt == 4:
                          raise
                      time.sleep(2 ** (attempt + 1))


          def existing_client_ids(arn):
              try:
                  provider = iam.get_open_id_connect_provider(OpenIDConnectProviderArn=arn)
                  return provider.get("ClientIDList", [])
              except iam.exceptions.NoSuchEntityException:
                  return None


          def retryable(e):
              code = e.response["Error"]["Code"]
              # An explicit deny comes from a policy such as an SCP, so waiting never resolves it.
              if code == "AccessDenied" and "explicit deny" in str(e):
                  return False
              return code in RETRYABLE


          def failure_reason(e):
              reason = f"{type(e).__name__}: {e}"
              if isinstance(e, ClientError) and e.response["Error"]["Code"] == "AccessDenied":
                  return ACCESS_DENIED_HINT + reason
              return reason


          def respond(event, status, physical_id, reason=None, data=None):
              body = {
                  "Status": status,
                  "PhysicalResourceId": physical_id,
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
              }
              if reason:
                  body["Reason"] = reason
              if data:
                  body["Data"] = data
              payload = json.dumps(body).encode()
              request = urllib.request.Request(
                  event["ResponseURL"],
                  data=payload,
                  method="PUT",
                  headers={"Content-Type": "", "Content-Length": str(len(payload))},
              )
              urllib.request.urlopen(request, timeout=10)

  WiiOidcProvider:
    Type: Custom::WiiOidcProvider
    Properties:
      ServiceToken: !GetAtt WiiOidcProviderFunction.Arn
      ServiceTimeout: "600"
      Url: !Sub
        - https://workload-identity-issuer.${ElasticCloudRegion}.${ElasticCloudProvider}.${Domain}/orgs/${ElasticOrganizationId}
        - Domain: !FindInMap
            - EnvironmentDomain
            - !Ref ElasticCloudEnvironment
            - Domain

  # The stack UUID (last "/" segment of the stack ARN) keeps the role name
  # unique across stacks; 24 + 36 chars stays under the 64-char limit.
  ElasticWorkloadIdentityRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub
        - ElasticWorkloadIdentity-${StackUuid}
        - StackUuid: !Select
            - 2
            - !Split
              - /
              - !Ref AWS::StackId
      AssumeRolePolicyDocument: !Sub
        - |
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": {
                  "Federated": "${ProviderArn}"
                },
                "Action": "sts:AssumeRoleWithWebIdentity",
                "Condition": {
                  "StringEquals": {
                    "${Issuer}:aud": "sts.amazonaws.com",
                    "${Issuer}:sub": "${ElasticResourceType}:${ElasticResourceId}"
                  }
                }
              }
            ]
          }
        - ProviderArn: !GetAtt WiiOidcProvider.Arn
          Issuer: !GetAtt WiiOidcProvider.Issuer
      Path: /
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonGuardDutyReadOnlyAccess

  ElasticAwsInspector:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ElasticAwsInspector
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - inspector2:ListFindings
            Resource: '*'
      Roles:
        - !Ref ElasticWorkloadIdentityRole

  ElasticAwsCloudwatchLogs:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ElasticAwsCloudwatchLogs
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - logs:DescribeLogGroups
              - logs:DescribeLogStreams
              - logs:FilterLogEvents
              - logs:GetLogEvents
              - logs:GetLogGroupFields
            Resource: '*'
      Roles:
        - !Ref ElasticWorkloadIdentityRole

  ElasticAwsMetrics:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ElasticAwsMetrics
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ec2:DescribeRegions
              - cloudwatch:ListMetrics
              - cloudwatch:GetMetricData
              - tag:GetResources
            Resource: '*'
      Roles:
        - !Ref ElasticWorkloadIdentityRole

  ElasticAwsHealth:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ElasticAwsHealth
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - health:DescribeEvents
              - health:DescribeEventDetails
              - health:DescribeAffectedEntities
            Resource: '*'
      Roles:
        - !Ref ElasticWorkloadIdentityRole

  ElasticAwsConfig:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ElasticAwsConfig
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - config:DescribeConfigRules
              - config:GetComplianceDetailsByConfigRule
            Resource: '*'
      Roles:
        - !Ref ElasticWorkloadIdentityRole

  ElasticAwsBilling:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ElasticAwsBilling
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ce:GetCostAndUsage
            Resource: '*'
      Roles:
        - !Ref ElasticWorkloadIdentityRole

  ElasticAwsDynamoDB:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ElasticAwsDynamoDB
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:ListTables
              - dynamodb:DescribeTable
            Resource: '*'
      Roles:
        - !Ref ElasticWorkloadIdentityRole

  ElasticAwsEBS:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ElasticAwsEBS
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ec2:DescribeVolumes
            Resource: '*'
      Roles:
        - !Ref ElasticWorkloadIdentityRole

  ElasticAwsEC2:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ElasticAwsEC2
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ec2:DescribeInstances
              - ec2:DescribeInstanceStatus
            Resource: '*'
      Roles:
        - !Ref ElasticWorkloadIdentityRole

  ElasticAwsECS:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ElasticAwsECS
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ecs:ListClusters
              - ecs:DescribeClusters
              - ecs:ListServices
              - ecs:DescribeServices
            Resource: '*'
      Roles:
        - !Ref ElasticWorkloadIdentityRole

  ElasticAwsELB:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ElasticAwsELB
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - elasticloadbalancing:DescribeLoadBalancers
              - elasticloadbalancing:DescribeTargetGroups
              - elasticloadbalancing:DescribeTargetHealth
            Resource: '*'
      Roles:
        - !Ref ElasticWorkloadIdentityRole

  ElasticAwsLambda:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ElasticAwsLambda
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - lambda:ListFunctions
              - lambda:GetFunction
            Resource: '*'
      Roles:
        - !Ref ElasticWorkloadIdentityRole

  ElasticAwsRDS:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ElasticAwsRDS
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - rds:DescribeDBInstances
              - rds:DescribeDBClusters
              - rds:ListTagsForResource
            Resource: '*'
      Roles:
        - !Ref ElasticWorkloadIdentityRole

  ElasticAwsSNS:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ElasticAwsSNS
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - sns:ListTopics
              - sns:GetTopicAttributes
            Resource: '*'
      Roles:
        - !Ref ElasticWorkloadIdentityRole

  ElasticAwsSQS:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ElasticAwsSQS
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - sqs:ListQueues
              - sqs:GetQueueAttributes
            Resource: '*'
      Roles:
        - !Ref ElasticWorkloadIdentityRole

  ElasticAwsTransitGateway:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ElasticAwsTransitGateway
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ec2:DescribeTransitGateways
              - ec2:DescribeTransitGatewayAttachments
            Resource: '*'
      Roles:
        - !Ref ElasticWorkloadIdentityRole

  ElasticAwsSecurityHub:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ElasticAwsSecurityHub
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - securityhub:GetFindings
              - securityhub:GetInsights
            Resource: '*'
      Roles:
        - !Ref ElasticWorkloadIdentityRole

  # When Kibana launches the stack with ElasticCallbackUrl and ElasticApiKey,
  # a custom resource posts the role ARN and the stack ARN to that URL. The
  # function always answers SUCCESS, so a failed report never fails or rolls
  # back the stack. The handler is the one the IaC Provisioner blueprint
  # ships (cloud-iac-provisioner, patches/common/callback.py) and is tested
  # there; keep the two identical.
  ElasticCallbackFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
    Condition: CallbackEnabled

  ElasticCallbackFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt ElasticCallbackFunctionRole.Arn
      Timeout: 90
      Code:
        ZipFile: |
          import json
          import time
          import urllib.error
          import urllib.request

          # Reports the role this stack created back to the Kibana that launched it, so the user does not
          # have to paste the Role ARN and stack ARN. The callback is a convenience: every path below
          # answers SUCCESS to CloudFormation, so a Kibana that cannot be reached (traffic filters,
          # PrivateLink, self-managed) leaves the stack intact and the user on the manual flow.
          #
          # Never print the event, the headers or the key: the API key is a credential, short-lived and
          # zero-privilege, but still a credential.

          ATTEMPTS = 4
          # A request (10 s), the longest backoff (8 s) and two response PUTs (10 s each, 1 s apart) must
          # all fit before Lambda kills the function; an unanswered custom resource would fail the stack
          # after ServiceTimeout, which is the one outcome this handler must never produce.
          RESERVE_MS = 40_000
          # A response PUT (10 s) and the longest response backoff (4 s) must fit before Lambda kills the
          # function.
          RESPONSE_RESERVE_MS = 15_000


          def handler(event, context):
              props = event.get("ResourceProperties", {})
              status = "skipped"
              try:
                  if event["RequestType"] in ("Create", "Update"):
                      status = post(props, context)
              except Exception as e:  # never let the stack hang or roll back because of the callback
                  status = f"failed: {type(e).__name__}"
              print("callback result", status)
              respond(event, context)


          def post(p, context):
              url = p["CallbackUrl"]
              body = json.dumps({"role_arn": p["RoleArn"], "stack_arn": p["StackId"]}).encode()
              headers = {
                  "Authorization": "ApiKey " + p["ApiKey"],
                  "kbn-xsrf": "true",
                  "Content-Type": "application/json",
                  "Elastic-Api-Version": "2023-10-31",
              }
              for attempt in range(ATTEMPTS):
                  try:
                      request = urllib.request.Request(url, data=body, headers=headers, method="POST")
                      with urllib.request.urlopen(request, timeout=10) as response:
                          print("callback status", response.status)
                          return "connected"
                  except urllib.error.HTTPError as e:
                      print("callback status", e.code)
                      if e.code < 500:
                          # Kibana answered: a 4xx will not change on retry (bad key, used or expired record).
                          return f"failed: http {e.code}"
                  except Exception as e:
                      # Only URLError.reason is safe to log; other exceptions may quote a header.
                      print("callback error", type(e).__name__, getattr(e, "reason", ""))
                  if attempt == ATTEMPTS - 1 or remaining_ms(context) < RESERVE_MS:
                      break
                  time.sleep(2 ** (attempt + 1))
              return "failed: unreachable"


          def remaining_ms(context):
              try:
                  return context.get_remaining_time_in_millis()
              except Exception:
                  return RESERVE_MS


          def respond(event, context):
              body = json.dumps(
                  {
                      "Status": "SUCCESS",
                      "PhysicalResourceId": event["StackId"] + ":elastic-callback",
                      "StackId": event["StackId"],
                      "RequestId": event["RequestId"],
                      "LogicalResourceId": event["LogicalResourceId"],
                  }
              ).encode()
              for attempt in range(ATTEMPTS):
                  request = urllib.request.Request(
                      event["ResponseURL"],
                      data=body,
                      method="PUT",
                      headers={"Content-Type": "", "Content-Length": str(len(body))},
                  )
                  try:
                      urllib.request.urlopen(request, timeout=10)
                      return
                  except Exception as e:
                      # Retry while the budget allows; the last error escapes, so the invocation shows
                      # as failed in CloudWatch.
                      print("response error", type(e).__name__)
                      if attempt == ATTEMPTS - 1 or remaining_ms(context) < RESPONSE_RESERVE_MS:
                          raise
                  time.sleep(2**attempt)
    Condition: CallbackEnabled

  # DependsOn lists every policy attached to ElasticWorkloadIdentityRole, so
  # Kibana only gets the role once it has all of its permissions.
  ElasticCallback:
    Type: Custom::ElasticCallback
    DependsOn:
      - ElasticAwsInspector
      - ElasticAwsCloudwatchLogs
      - ElasticAwsMetrics
      - ElasticAwsHealth
      - ElasticAwsConfig
      - ElasticAwsBilling
      - ElasticAwsDynamoDB
      - ElasticAwsEBS
      - ElasticAwsEC2
      - ElasticAwsECS
      - ElasticAwsELB
      - ElasticAwsLambda
      - ElasticAwsRDS
      - ElasticAwsSNS
      - ElasticAwsSQS
      - ElasticAwsTransitGateway
      - ElasticAwsSecurityHub
    Properties:
      ServiceToken: !GetAtt ElasticCallbackFunction.Arn
      ServiceTimeout: "120"
      CallbackUrl: !Ref ElasticCallbackUrl
      ApiKey: !Ref ElasticApiKey
      RoleArn: !GetAtt ElasticWorkloadIdentityRole.Arn
      StackId: !Ref AWS::StackId
    Condition: CallbackEnabled

Outputs:
  RoleArn:
    Description: The ARN of the IAM Role. Paste this into Kibana.
    Value: !GetAtt ElasticWorkloadIdentityRole.Arn

  OidcProviderArn:
    Description: The IAM OIDC provider this role trusts. Shared by every stack for the same issuer in this account; delete it manually once the last such stack is gone.
    Value: !GetAtt WiiOidcProvider.Arn

  StackId:
    Description: Store this in Kibana to construct stack-update URLs later.
    Value: !Ref AWS::StackId
