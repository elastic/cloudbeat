AWSTemplateFormatVersion: "2010-09-09"

Description: 'Creates an IAM Role for Elastic Workload Identity Federation. The role can be assumed only by the given Elastic deployment or project and grants read-only permissions for all Elastic AWS integrations that support Identity Federation: the AWS package integrations (GuardDuty, Inspector, Config, CloudWatch, and metrics services)'

Parameters:
  ElasticIssuer:
    Description: Issuer of the Elastic Workload Identity tokens, as pre-filled by Kibana. This is the JWT iss claim without the https:// scheme, for example workload-identity-issuer.eu-west-1.aws.svc.elastic.cloud/orgs/1234567890.
    Type: String
    AllowedPattern: ^workload-identity-issuer\.[a-z0-9-]+\.(aws|azure|gcp)\.svc(\.(qa|staging))?\.elastic\.cloud/orgs/[A-Za-z0-9]{1,32}$
    ConstraintDescription: must be workload-identity-issuer.<region>.<aws|azure|gcp>.svc[.qa|.staging].elastic.cloud/orgs/<organization id>.

  ElasticSubject:
    Description: Elastic resource allowed to assume the role, as pre-filled by Kibana. This is the JWT sub claim, deployment:<Kibana component ID> for Elastic Cloud Hosted or project:<project ID> for Elastic Cloud Serverless.
    Type: String
    AllowedPattern: ^(deployment|project):[A-Za-z0-9]+$
    ConstraintDescription: must be deployment:<id> or project:<id>, letters and digits only.

  CreateOidcProvider:
    Description: IAM allows one OIDC provider per issuer per account. Keep true for the first stack. Set to false if a provider for this issuer already exists, either from another stack for the same organization and region or left behind by a deleted one.
    Type: String
    AllowedValues:
      - "true"
      - "false"
    Default: "true"

Conditions:
  ShouldCreateOidcProvider: !Equals
    - !Ref CreateOidcProvider
    - "true"

Resources:

  # No ThumbprintList: IAM ignores it for publicly trusted CAs.
  # Other stacks may reference this provider via CreateOidcProvider=false, so
  # it outlives the stack. RetainExceptOnCreate still removes it when the
  # creating stack rolls back, so a failed first attempt does not block a
  # retry with the default parameters.
  WiiOidcProvider:
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: !Sub https://${ElasticIssuer}
      ClientIdList:
        - sts.amazonaws.com
    Condition: ShouldCreateOidcProvider

  # Suffix is the stack UUID, the last "/" segment of the stack ARN. Splitting
  # the whole ARN on "-" also splits the region and stack name, so the same
  # index came out identical for every stack. 24 + 36 chars stays under the
  # 64-char IAM role name limit.
  ElasticWorkloadIdentityRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub
        - ElasticWorkloadIdentity-${StackUuid}
        - StackUuid: !Select
            - 2
            - !Split
              - /
              - !Ref AWS::StackId
      AssumeRolePolicyDocument: !Sub
        - |
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": {
                  "Federated": "${ProviderArn}"
                },
                "Action": "sts:AssumeRoleWithWebIdentity",
                "Condition": {
                  "StringEquals": {
                    "${ElasticIssuer}:aud": "sts.amazonaws.com",
                    "${ElasticIssuer}:sub": "${ElasticSubject}"
                  }
                }
              }
            ]
          }
        - ProviderArn: !If
            - ShouldCreateOidcProvider
            - !GetAtt WiiOidcProvider.Arn
            - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/${ElasticIssuer}
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonGuardDutyReadOnlyAccess

  ElasticAwsInspector:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ElasticAwsInspector-${AWS::StackName}
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - inspector2:ListFindings
            Resource: '*'
      Roles:
        - !Ref ElasticWorkloadIdentityRole

  ElasticAwsCloudwatchLogs:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ElasticAwsCloudwatchLogs-${AWS::StackName}
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - logs:DescribeLogGroups
              - logs:DescribeLogStreams
              - logs:FilterLogEvents
              - logs:GetLogEvents
              - logs:GetLogGroupFields
            Resource: '*'
      Roles:
        - !Ref ElasticWorkloadIdentityRole

  ElasticAwsMetrics:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ElasticAwsMetrics-${AWS::StackName}
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ec2:DescribeRegions
              - cloudwatch:ListMetrics
              - cloudwatch:GetMetricData
              - tag:GetResources
            Resource: '*'
      Roles:
        - !Ref ElasticWorkloadIdentityRole

  ElasticAwsHealth:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ElasticAwsHealth-${AWS::StackName}
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - health:DescribeEvents
              - health:DescribeEventDetails
              - health:DescribeAffectedEntities
            Resource: '*'
      Roles:
        - !Ref ElasticWorkloadIdentityRole

  ElasticAwsConfig:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ElasticAwsConfig-${AWS::StackName}
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - config:DescribeConfigRules
              - config:GetComplianceDetailsByConfigRule
            Resource: '*'
      Roles:
        - !Ref ElasticWorkloadIdentityRole

  ElasticAwsBilling:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ElasticAwsBilling-${AWS::StackName}
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ce:GetCostAndUsage
            Resource: '*'
      Roles:
        - !Ref ElasticWorkloadIdentityRole

  ElasticAwsDynamoDB:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ElasticAwsDynamoDB-${AWS::StackName}
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:ListTables
              - dynamodb:DescribeTable
            Resource: '*'
      Roles:
        - !Ref ElasticWorkloadIdentityRole

  ElasticAwsEBS:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ElasticAwsEBS-${AWS::StackName}
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ec2:DescribeVolumes
            Resource: '*'
      Roles:
        - !Ref ElasticWorkloadIdentityRole

  ElasticAwsEC2:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ElasticAwsEC2-${AWS::StackName}
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ec2:DescribeInstances
              - ec2:DescribeInstanceStatus
            Resource: '*'
      Roles:
        - !Ref ElasticWorkloadIdentityRole

  ElasticAwsECS:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ElasticAwsECS-${AWS::StackName}
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ecs:ListClusters
              - ecs:DescribeClusters
              - ecs:ListServices
              - ecs:DescribeServices
            Resource: '*'
      Roles:
        - !Ref ElasticWorkloadIdentityRole

  ElasticAwsELB:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ElasticAwsELB-${AWS::StackName}
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - elasticloadbalancing:DescribeLoadBalancers
              - elasticloadbalancing:DescribeTargetGroups
              - elasticloadbalancing:DescribeTargetHealth
            Resource: '*'
      Roles:
        - !Ref ElasticWorkloadIdentityRole

  ElasticAwsLambda:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ElasticAwsLambda-${AWS::StackName}
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - lambda:ListFunctions
              - lambda:GetFunction
            Resource: '*'
      Roles:
        - !Ref ElasticWorkloadIdentityRole

  ElasticAwsRDS:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ElasticAwsRDS-${AWS::StackName}
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - rds:DescribeDBInstances
              - rds:DescribeDBClusters
              - rds:ListTagsForResource
            Resource: '*'
      Roles:
        - !Ref ElasticWorkloadIdentityRole

  ElasticAwsSNS:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ElasticAwsSNS-${AWS::StackName}
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - sns:ListTopics
              - sns:GetTopicAttributes
            Resource: '*'
      Roles:
        - !Ref ElasticWorkloadIdentityRole

  ElasticAwsSQS:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ElasticAwsSQS-${AWS::StackName}
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - sqs:ListQueues
              - sqs:GetQueueAttributes
            Resource: '*'
      Roles:
        - !Ref ElasticWorkloadIdentityRole

  ElasticAwsTransitGateway:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ElasticAwsTransitGateway-${AWS::StackName}
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ec2:DescribeTransitGateways
              - ec2:DescribeTransitGatewayAttachments
            Resource: '*'
      Roles:
        - !Ref ElasticWorkloadIdentityRole

  ElasticAwsSecurityHub:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ElasticAwsSecurityHub-${AWS::StackName}
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - securityhub:GetFindings
              - securityhub:GetInsights
            Resource: '*'
      Roles:
        - !Ref ElasticWorkloadIdentityRole

Outputs:
  RoleArn:
    Description: The ARN of the IAM Role. Paste this into Kibana.
    Value: !GetAtt ElasticWorkloadIdentityRole.Arn

  OidcProviderArn:
    Description: The IAM OIDC provider this role trusts. Shared by every stack for the same issuer in this account; delete it manually once the last such stack is gone.
    Value: !If
      - ShouldCreateOidcProvider
      - !GetAtt WiiOidcProvider.Arn
      - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/${ElasticIssuer}

  StackId:
    Description: Store this in Kibana to construct stack-update URLs later.
    Value: !Ref AWS::StackId
