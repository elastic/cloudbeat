# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
#
# Weekly scheduler that fans out DRA refresh builds to all team-maintained
# cloudbeat branches (main + Mergify backport destinations).

steps:
  - label: ":pipeline: Generate cloudbeat DRA triggers for maintained branches"
    command: .buildkite/scripts/dra-scheduler.sh
    agents:
      image: docker.elastic.co/release-eng/wolfi-build-essential-release-eng:latest
      cpu: 250m
      memory: 512Mi
      ephemeralStorage: 1Gi
    timeout_in_minutes: 15
