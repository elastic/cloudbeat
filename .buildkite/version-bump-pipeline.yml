notify:
  - slack:
      channels:
        - "#cloudbeat"
      message: "<!subteam^S0BRESE4P5H|conduit-siem> Version bump to ${NEW_VERSION} — ${BUILDKITE_BUILD_URL}"
    if: (build.branch == 'main' || build.branch =~ /^[0-9]+\.[0-9x]+$/) && (build.state == 'passed' || build.state == 'failed')
  - slack:
      channels:
        - "#cloudbeat"
      message: |
        <!subteam^S0BRESE4P5H|conduit-siem>
        🚦 Pipeline waiting for approval 🚦
        Repo: `${REPO}`

        New version: `${NEW_VERSION}`
        Branch: `${BRANCH}`
        Workflow: `${WORKFLOW}`
        ${BUILDKITE_BUILD_URL}
    if: build.state == "blocked"

steps:

  - group: ":arrow_up: Bump version"
    key: bump-version
    steps:
      - label: "Patch"
        key: bump-version-patch
        if: build.env("WORKFLOW") == "patch"
        agents:
          image: docker.elastic.co/release-eng/wolfi-build-essential-release-eng:latest
          cpu: 250m
          memory: 512Mi
          ephemeralStorage: 1Gi
        plugins:
          - elastic/vault-github-token#v0.2.3: ~
        command:
          - .buildkite/scripts/release/bump-patch.sh
        timeout_in_minutes: 15

      - label: "Minor"
        key: bump-version-minor
        if: build.env("WORKFLOW") == "minor"
        agents:
          image: docker.elastic.co/release-eng/wolfi-build-essential-release-eng:latest
          cpu: 250m
          memory: 512Mi
          ephemeralStorage: 1Gi
        plugins:
          - elastic/vault-github-token#v0.2.3: ~
        command:
          - .buildkite/scripts/release/bump-minor.sh
        timeout_in_minutes: 15

  - label: ":slack: Notify team bump PR ready"
    key: notify-bump-pr-ready
    if: build.env("WORKFLOW") == "patch"
    depends_on: bump-version-patch
    agents:
      image: docker.elastic.co/release-eng/wolfi-build-essential-release-eng:latest
      cpu: 250m
      memory: 512Mi
      ephemeralStorage: 1Gi
    command: echo "Version bump PR is ready"
    notify:
      - slack:
          channels:
            - "#cloudbeat"
          message: "<!subteam^S0BRESE4P5H|conduit-siem> Version bump PR for ${NEW_VERSION} is ready, please review and merge — ${BUILDKITE_BUILD_URL}"

  - block: "Wait for PR merge"
    prompt: "Continue after the bump PR is merged and all checks have passed."
    key: wait-for-merge
    if: build.env("WORKFLOW") == "minor"
    depends_on: bump-version-minor
    blocked_state: running

  - label: ":twisted_rightwards_arrows: Branch out + bump main"
    key: post-minor-merge
    if: build.env("WORKFLOW") == "minor"
    depends_on: wait-for-merge
    agents:
      image: docker.elastic.co/release-eng/wolfi-build-essential-release-eng:latest
      cpu: 250m
      memory: 512Mi
      ephemeralStorage: 1Gi
    plugins:
      - elastic/vault-github-token#v0.2.3: ~
    command:
      - .buildkite/scripts/release/post-minor-merge.sh
    timeout_in_minutes: 15

  - label: "Fetch DRA Artifacts"
    key: fetch-dra-artifacts
    depends_on:
      - bump-version-patch
      - post-minor-merge
    agents:
      image: docker.elastic.co/release-eng/wolfi-build-essential-release-eng:latest
      cpu: 250m
      memory: 512Mi
      ephemeralStorage: 1Gi
    timeout_in_minutes: 480
    retry:
      automatic:
        - exit_status: "*"
          limit: 2
      manual:
        permit_on_passed: true

    plugins:
      - elastic/version-bump-dra#v1.0.0:
          product: "cloudbeat"
          version: "${NEW_VERSION}"
          workflow: "${WORKFLOW}"
          polling_interval: 30


  # TODO(task-7): wire AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY and SNYK_* via
